name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
    

      - name: Install dependencies
        run: npm install

      # GitHub Pages can only host static files, so build with the Node preset
      # and prerender every page to static HTML in dist/client.
      - name: Build website (static export)
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NITRO_PRESET: node-server

      # Let GitHub Pages serve the app for client-side routes it has no file for
      - name: Add SPA fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
